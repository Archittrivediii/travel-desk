<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
/* Layout: slim top bar with role switcher, tab rail, one working column of panels. Boarding-pass route strips (DEL → BOM) carry each trip. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14202B; --ink-2:#4A5967; --line:#D9DFE5;
  --accent:#0B5D7A; --accent-ink:#FFFFFF; --accent-soft:#DCEEF4;
  --ok:#1B7A4B; --ok-bg:#E1F3E9; --warn:#8F5600; --warn-bg:#FBEBCF; --bad:#B3261E; --bad-bg:#FAE0DD; --info:#27508F; --info-bg:#E1EAF8;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --wbg:#EFEFEF; --wlabel:#E4E4E4; --wfield:#FFFFFF; --wline:#8A8A8A; --wstrong:#1A1A1A; --wgrid:#BDBDBD; --wt1:#DDE8F3; --wt2:#CCDCEC; --wtc:#566370; --kh:#FFF1A8; --khi:#3B3200;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1720; --surface:#17212C; --surface-2:#1D2935; --ink:#E7EDF2; --ink-2:#9BAAB7; --line:#2A3846;
  --accent:#5CC2E3; --accent-ink:#07202B; --accent-soft:#16323E;
  --ok:#5BD08F; --ok-bg:#12301F; --warn:#F0B455; --warn-bg:#3A2A0C; --bad:#FF8E85; --bad-bg:#3F1A17; --info:#8FB4F2; --info-bg:#172A47; --wbg:#1A2530; --wlabel:#243342; --wfield:#101A24; --wline:#5B6D7D; --wstrong:#B8C4CE; --wgrid:#33465A; --wt1:#27405A; --wt2:#1F3347; --wtc:#A9B9C7; --kh:#4A4112; --khi:#F6EBB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#17212C; --surface-2:#1D2935; --ink:#E7EDF2; --ink-2:#9BAAB7; --line:#2A3846;
  --accent:#5CC2E3; --accent-ink:#07202B; --accent-soft:#16323E;
  --ok:#5BD08F; --ok-bg:#12301F; --warn:#F0B455; --warn-bg:#3A2A0C; --bad:#FF8E85; --bad-bg:#3F1A17; --info:#8FB4F2; --info-bg:#172A47; --wbg:#1A2530; --wlabel:#243342; --wfield:#101A24; --wline:#5B6D7D; --wstrong:#B8C4CE; --wgrid:#33465A; --wt1:#27405A; --wt2:#1F3347; --wtc:#A9B9C7; --kh:#4A4112; --khi:#F6EBB0; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
#auth{padding-block:7vh 40px}
.authbox{max-width:400px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.authstub{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;padding:12px 20px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.12em}
.authbody{padding:22px 20px 24px;display:flex;flex-direction:column;gap:14px;border-top:2px dashed var(--line)}
.authbody h1{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:0}
.authbody p{margin:0}
.authbody form{display:flex;flex-direction:column;gap:14px}
.showpw{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.btn.wide{width:100%;padding:10px 12px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1040px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:5px 0}
.mods{display:inline-flex;border:1px solid var(--line,var(--wline));border-radius:8px;overflow:hidden;margin-inline:auto 0}
.modb{font:inherit;font-size:12px;font-weight:600;padding:5px 14px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.modb+.modb{border-left:1px solid var(--line,var(--wline))}
.modb[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.modb:focus-visible{outline:2px solid var(--accent,#0F5E7A);outline-offset:-2px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--font-display);font-size:17px;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand span{color:var(--ink-2);font-size:11px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who label{font-size:12px;color:var(--ink-2)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:0 5px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:4px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center}

.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:17px;margin:0 0 12px;letter-spacing:-.005em}
.panel h2 small{font-family:var(--font-body);font-weight:400;color:var(--ink-2);font-size:12px;margin-left:8px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}

.trip{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trip:first-of-type{border-top:0}
.route{font-family:var(--font-mono);font-size:16px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route i{font-style:normal;color:var(--accent)}
.meta{color:var(--ink-2);font-size:12.5px}
.meta b{color:var(--ink);font-weight:500}
.id{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.cost{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;grid-column:1/-1}
.trip .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.flags{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:12.5px;color:var(--warn)}

form .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.f.wide{grid-column:1/-1}
.est{margin-top:14px;padding:12px;border-radius:6px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;align-items:center}
.est .tot{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.err{color:var(--bad);margin-top:8px;min-height:1em;font-size:13px}
.formacts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:500}
td.num,th.num{text-align:right}
td input{width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:4px 6px;text-align:right}
.mono{font-family:var(--font-mono)}

.bud{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.bud:first-of-type{border-top:0}
.bud .l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:flex;overflow:hidden}
.seg-c{background:var(--accent)}
.seg-p{background:repeating-linear-gradient(45deg,var(--accent-soft),var(--accent-soft) 4px,var(--line) 4px,var(--line) 8px)}

.empty{color:var(--ink-2);padding:14px 0}
.wrap.wide{max-width:1680px}
.win{border:1px solid var(--wline);background:var(--wbg);font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink)}
.wtitle{background:linear-gradient(var(--wt1),var(--wt2));color:var(--wtc);padding:3px 10px;font-size:12px;border-bottom:1px solid var(--wline)}
.wbody{padding:6px 10px 10px;min-width:0}
.wbtn{border:1px solid var(--wgrid);background:var(--wfield);color:var(--ink);padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:0}
.wbtn:hover{background:var(--wlabel)}
.wbtn.on{background:var(--wlabel);color:var(--ink-2)}
.wbtn.add{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wtabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}
.wtop{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px;align-items:start}
.wleft{display:flex;flex-direction:column;gap:3px;min-width:0}
.wrow{display:grid;grid-template-columns:116px minmax(0,1fr);gap:5px;align-items:center}
.wlab{background:var(--wlabel);border:1px solid var(--wline);padding:1px 6px;font-size:11px}
.wf{border:1px solid var(--wgrid);background:var(--wfield);padding:1px 6px;font:inherit;font-size:11px;color:var(--ink-2);width:100%;min-width:0;border-radius:0}
.wf.live{color:var(--ink)}
.wcode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wcode select{width:96px}
.wradio{display:flex;gap:12px;background:var(--wlabel);border:1px solid var(--wgrid);padding:1px 6px;font-size:11px}
.wradio label{display:flex;gap:6px;align-items:center;cursor:pointer}
.wpolwrap{overflow-x:auto;min-width:0}
.wpol{border-collapse:collapse;background:var(--wfield);width:100%}
.wpol td,.wpol th{border:1px solid var(--wstrong);padding:0 5px;text-align:left;white-space:normal;font-weight:400;text-transform:none;letter-spacing:0;font-size:10.5px;color:var(--ink);line-height:1.2}
.wpol th{font-weight:600}
.wpol td.pl{font-weight:700;font-size:11px;width:96px;vertical-align:top}
.wnote{margin:3px 0 0;color:var(--ink-2);font-size:10px;line-height:1.25}
.wgridwrap{overflow-x:auto;margin-top:6px;border:1px solid var(--wgrid);background:var(--wfield)}
.wgrid{border-collapse:collapse;table-layout:fixed;min-width:1100px;width:100%;font-size:11px}
.wgrid th{background:var(--wfield);font-weight:700;font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink);padding:3px 5px;border-bottom:2px solid var(--wstrong);border-right:1px solid var(--wgrid);white-space:normal;vertical-align:bottom;text-align:left}
.wgrid td{height:26px;padding:0 5px;border-bottom:1px solid var(--wgrid);border-right:1px solid var(--wgrid);white-space:normal;overflow-wrap:anywhere;vertical-align:middle}
.wgrid td.num,.wgrid th.num{text-align:right}
.wgrid tr.entry td{padding:0;background:var(--accent-soft)}
.wgrid td input,.wgrid td select{width:100%;min-width:0;border:0;background:transparent;font:inherit;font-size:11px;color:var(--ink);padding:4px 5px;border-radius:0;text-align:left}
.wgrid td input[type=number]{text-align:right}
.wgrid td input[readonly]{color:var(--ink-2)}
.wgrid td input:focus,.wgrid td select:focus{outline:2px solid var(--accent);outline-offset:-2px}
#g-amt{font-weight:600}
.wgrid td.amt{text-align:right;font-weight:600;padding:0 8px;font-variant-numeric:tabular-nums}
.wgrid small{display:block;color:var(--ink-2);font-size:9.5px;line-height:1.1;padding:0 5px 2px}
.wgrid .btn.sm{font-size:10px;padding:1px 5px;white-space:nowrap}
.wtotal{text-align:right;margin-top:8px;font-weight:600;font-variant-numeric:tabular-nums}
.wbtnrow{display:flex;justify-content:center;margin-top:10px}
.wbody .scroll{background:var(--surface)}
.wsum{font-size:12px;font-weight:700;margin:2px 0 0}.wsum small{font-weight:400;color:var(--ink-2);margin-left:6px}
.wbot{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;margin-top:6px;align-items:start}
.wbr{border:1px solid var(--wgrid);background:var(--wfield);overflow:hidden}.wdet{min-width:0}
.wexp{border:2px solid var(--wstrong);background:var(--wlabel)}
.wexph{font-weight:700;font-size:13px;padding:2px 10px;border-bottom:1px solid var(--wstrong)}
.wexpt{border-collapse:separate;border-spacing:3px 2px;width:100%;font-size:11px}
.wexpt th{font-weight:400;text-align:center;font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink);padding:0 4px;background:none;border:0;white-space:nowrap}
.wexpt tbody th{text-align:left}
.wexpt td{background:var(--wfield);border:1px solid var(--wgrid);text-align:right;padding:2px 6px;font-variant-numeric:tabular-nums}
@media (max-width:900px){.wbot{grid-template-columns:minmax(0,1fr)}}
.wtl{display:inline-block;border:1px solid var(--wgrid);background:var(--wlabel);font-weight:700;font-size:12px;padding:3px 14px;margin:6px 0 0 4px;min-width:160px}
.wta{display:block;width:100%;border:1px solid var(--wgrid);background:var(--wfield);color:var(--ink);font:inherit;font-size:12px;padding:6px 8px;resize:none;border-radius:0}
.wfinbox{max-width:760px;padding:6px 4px}
.wfin{grid-template-columns:200px minmax(0,1fr);margin-bottom:6px;align-items:start}
.wlab2{font-size:12px;padding:6px 4px}
.wfinbox .wf{font-size:12px;padding:6px 8px;min-height:30px}
.wfinbox select.wf{height:32px}
.wfile{font-size:12px;padding:3px 2px}
.wstat{margin-top:12px;border:1px solid var(--wgrid);background:var(--wfield);min-height:30px;padding:6px 8px;font-size:12px}
.aptop{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:10px;align-items:center;margin-bottom:6px}
.aptop input{font-size:12px;padding:6px 8px}
.apbtns{display:flex;gap:8px;justify-content:center}
.apscroll{overflow:auto;max-height:50vh;border:1px solid var(--wgrid);background:var(--wfield)}
.apt{table-layout:fixed;min-width:980px}
.apt thead th{position:sticky;top:0;z-index:1}
.apt td{height:24px;overflow-wrap:anywhere}
.apt td.c{text-align:center;padding:0}
.apt tr[data-act=ap-sel]{cursor:pointer}.apt tr.sel td{background:var(--accent-soft)}
.apt td input[type=text]{width:100%;border:1px solid var(--wgrid);background:var(--wfield);font:inherit;font-size:11px;padding:2px 4px;color:var(--ink)}
.emptyc{text-align:center;color:var(--ink-2);padding:14px!important}
.apbot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:8px;align-items:start}
.apbr{border:1px solid var(--wgrid);background:var(--wfield);overflow:auto;max-height:200px}
.wtrail{min-width:0;table-layout:fixed}
@media (max-width:1000px){.phead{grid-template-columns:auto minmax(120px,1fr) auto minmax(120px,1fr)}}
@media (max-width:900px){.aptop{grid-template-columns:1fr}.apbot{grid-template-columns:1fr}}
.rpt{max-width:1100px}
.rh{font-size:12px;margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--wstrong)}
.rhead,.rmg{border-collapse:collapse;width:100%;font-size:12px;background:var(--wfield)}
.rhead td,.rmg td{border:1px solid var(--wgrid);padding:3px 8px;vertical-align:top}
.rhead td:nth-child(odd),.rmg td:first-child{background:var(--wlabel);font-weight:600;width:16%}
.rbox{border:1px solid var(--wgrid);margin-bottom:6px;background:var(--wfield)}
.rbl{background:var(--wlabel);font-weight:700;font-size:12px;padding:3px 8px;border-bottom:1px solid var(--wgrid)}
.rbv{padding:6px 8px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:24px}
.rinv{margin:0;padding-left:18px;font-size:12px}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important}
  .top,#tabs,.foot,.toast,.noprint,.auth{display:none!important}
  .wrap{max-width:none!important;padding:0!important}
  .win{border:0!important}.wtitle{display:none!important}
  .wgridwrap,.apbr{overflow:visible!important;max-height:none!important}
  .rbox,.rhead,.rmg,.wgrid tr{break-inside:avoid}
  .rh{break-after:avoid}
  .rh+.apbr{break-before:avoid}
  a{color:#000!important;text-decoration:none!important}
}
.phead{display:grid;grid-template-columns:auto minmax(120px,1.1fr) auto minmax(120px,1.4fr) auto minmax(120px,1fr) auto minmax(100px,1fr);gap:4px 8px;align-items:center;margin:6px 0}
.phl{font-size:11px;font-weight:700;text-align:right;white-space:nowrap}
.phead .wf{font-size:11px;padding:3px 6px;min-height:24px}
.ptabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--wline);margin-top:4px}
.ptab{font:inherit;font-size:11px;padding:4px 10px;border:1px solid var(--wgrid);border-bottom:0;background:var(--wlabel);color:var(--ink);cursor:pointer}
.ptab.on{background:var(--wfield);font-weight:700}.ptab:disabled{color:var(--ink-2);cursor:not-allowed}
.vgrid{min-width:760px}
.vgrid th{top:0;border-bottom:2px solid var(--wstrong)}
.vgrid td.vl{padding:4px 6px;line-height:1.3}
.vgrid tr.v1 td{background:#bcd3ee;color:#10253f;font-weight:700}
.vgrid tr.v1 td.vl{text-align:center;font-size:12px}
.vgrid .vt{font-weight:700;font-size:12px}.vgrid .vs{font-size:10.5px;font-weight:400;line-height:1.35}
.vgrid tr.v2 td{background:var(--wlabel)}
.vgrid tr.v3 td{background:var(--wlabel)}
.vgrid tr.v3 td.vl{padding-left:14px}
.vgrid tr.v2 td{background:var(--wfield)}
.vgrid tr.v2 td.vl{padding:3px 6px}
.vgrid tr.v1 td.kc,.vgrid tr.v2 td.kc{font-weight:700}
.vgrid td.kn{text-align:right;padding:2px 8px}
.vgrid .vin{text-align:right;background:var(--wfield)}
.vgrid .vin[readonly]{background:var(--wlabel)}
.vgrid .kin.bad{outline:2px solid var(--bad);outline-offset:-2px}
.vgrid .kta{background:var(--wfield)}.vgrid .kta[readonly]{background:var(--wlabel)}
.vedit .kin{background:var(--wfield);border:0}
.vedit td{padding:1px}
.vedit .vbtn{font:inherit;font-size:13px;line-height:1;padding:2px 6px;border:1px solid var(--wgrid);background:var(--wlabel);color:var(--ink);cursor:pointer}

.cpage .csum{margin-bottom:20px}
.cbox{border:1px solid var(--wline);background:var(--wfield)}.cbox.cj{border-top:0}
.cbh{font-weight:700;font-size:12px;padding:3px 6px}
.cta{display:block;width:100%;box-sizing:border-box;border:0;background:var(--wfield);color:var(--ink);font:inherit;font-size:12px;line-height:1.35;padding:3px 6px;resize:vertical;min-height:2.2em}

.kgrid input[data-kf=threshold],.kgrid input[data-kf=target],.kgrid input[data-kf=weight],.kgrid input[data-kf=selfAch],.kgrid input[data-kf=mgrAch]{text-align:right}

.toast.on{opacity:1}

<body>
<div class="wrap" hidden>
  <header class="top">
    <div class="brand"><h1 id="brandh">Travel Desk</h1><span id="brands">Requests, approvals and expenses</span></div>
    <div class="mods" id="mods" role="group" aria-label="Choose a module"></div>
    <div class="who"><span class="meta" id="whoami"></span><button class="btn sm" id="chpw" type="button">Change password</button><button class="btn sm" id="signout" type="button">Sign out</button></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <div class="foot">
    <span>Data is saved in the PostgreSQL database.</span>
    <button class="linkbtn" id="reset" type="button">Reset example data</button>
  </div>
</div>
<div id="auth" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var _n=new Date(),TODAY=_n.getFullYear()+'-'+('0'+(_n.getMonth()+1)).slice(-2)+'-'+('0'+_n.getDate()).slice(-2),KEY='traveldesk-pg';
var CITIES={DEL:'Delhi',BOM:'Mumbai',BLR:'Bengaluru',HYD:'Hyderabad',MAA:'Chennai',CCU:'Kolkata',PNQ:'Pune',AMD:'Ahmedabad'};
var CLASSES=['Economy','Premium Economy','Business'];
var CATS=['Flight','Hotel','Cab and local','Meals','Other'];
var inr=new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fd(iso){return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function nights(t){return Math.max(0,Math.round((new Date(t.ret)-new Date(t.dep))/864e5))}

var S={users:[],policy:{},budgets:{},trips:[],expenses:[]};
var UI={mod:'travel',uid:'',tab:'overview',form:false,expForm:false,expTab:'new',step:'enter',region:'dom',last:null};
function emptyState(){return {users:[],policy:{},budgets:{},trips:[],expenses:[]}}
function api(method,url,body){
  return fetch(url,{method:method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'travel-desk'},body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(!r.ok){
        if(r.status===401&&url!=='/api/login'&&url!=='/api/me')sessionEnded();
        var e=new Error(j.error||'The server returned an error ('+r.status+').');e.status=r.status;throw e;
      }
      return j;
    });
  });
}
function load(){return api('GET','/api/state').then(function(d){S=d})}
function fail(e){if(e&&e.status===401)return;toast(e&&e.message?e.message:'Something went wrong.')}
function run(p,msg,after){return p.then(function(r){return load().then(function(){if(msg)toast(typeof msg==='function'?msg(r):msg);if(after)after(r);render()})}).catch(function(e){fail(e);render()})}
function me(){return S.users.filter(function(u){return u.id===UI.uid})[0]}
function user(id){return S.users.filter(function(u){return u.id===id})[0]}
function trip(id){return S.trips.filter(function(t){return t.id===id})[0]}

function est(t,grade){var p=S.policy[grade];return t.fare+t.hotel*nights(t)+p.da*(nights(t)+1)}
function tripCost(t){return est(t,user(t.emp).grade)}
function flags(t){
  var u=user(t.emp),p=S.policy[u.grade],f=[];
  if(t.cls>p.cls)f.push(CLASSES[t.cls]+' is above the '+CLASSES[p.cls]+' limit for '+u.grade);
  if(t.hotel>p.hotel)f.push('Hotel '+inr.format(t.hotel)+'/night is above the '+inr.format(p.hotel)+' cap for '+u.grade);
  return f;
}
function statusPill(s){var c={'Approved':'ok','Rejected':'bad','Pending manager':'warn','Pending finance':'info','Submitted':'warn','Reimbursed':'ok','Draft':'info','Pending HOD':'warn'}[s]||'info';return '<span class="pill '+c+'">'+esc(s)+'</span>'}

function canAct(t){var m=me();
  if(t.status==='Pending manager')return m.role==='manager'&&t.emp!==m.id;
  if(t.status==='Pending finance')return m.role==='admin'&&t.emp!==m.id;
  return false}
function visibleTrips(){var m=me();
  if(m.role==='admin')return S.trips.slice();
  if(m.role==='manager')return S.trips.slice();
  return S.trips.filter(function(t){return t.emp===m.id})}
function pendingForMe(){return S.trips.filter(canAct)}
function visibleExp(){var m=me();
  if(m.role==='admin')return S.expenses.slice();
  if(m.role==='manager')return S.expenses.filter(function(e){return e.emp===m.id||user(e.emp).dept===m.dept});
  return S.expenses.filter(function(e){return e.emp===m.id})}
function canActExp(e){var m=me();
  if(e.status!=='Pending HOD'||e.emp===m.id||e.claimId)return false;
  if(m.role==='manager')return user(e.emp).dept===m.dept&&user(e.emp).role!=='manager';
  if(m.role==='admin')return user(e.emp).role==='manager';
  return false}
function pendingExpForMe(){return S.expenses.filter(canActExp)}
function hodOf(u){return S.users.filter(function(x){return x.role==='manager'&&x.dept===u.dept&&x.id!==u.id})[0]}

function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}

function tripRow(t,opts){
  opts=opts||{};var u=user(t.emp),fl=flags(t),n=nights(t);
  var a='';
  if(opts.actions&&canAct(t))a='<div class="acts"><button class="btn sm ok" data-act="approve" data-id="'+t.id+'">Approve</button><button class="btn sm bad" data-act="reject" data-id="'+t.id+'">Reject</button></div>';
  return '<div class="trip"><div><div class="route">'+t.from+' <i>&rarr;</i> '+t.to+'</div>'+
    '<div class="meta">'+esc(CITIES[t.from])+' to '+esc(CITIES[t.to])+' &middot; '+fd(t.dep)+' to '+fd(t.ret)+' ('+n+' night'+(n===1?'':'s')+')</div>'+
    '<div class="meta"><b>'+esc(t.purpose)+'</b>'+(t.advance>0?' &middot; Advance taken '+inr.format(t.advance):'')+'</div>'+
    (fl.length?'<div class="flags">'+fl.map(function(x){return '<span>Out of policy: '+esc(x)+'</span>'}).join('')+'</div>':'')+'</div>'+
    '<div><div><b>'+esc(u.name)+'</b></div><div class="meta">'+esc(u.dept)+' &middot; Grade '+u.grade+' &middot; '+CLASSES[t.cls]+'</div><div class="id">'+t.id+'</div></div>'+
    '<div class="right"><div class="cost">'+inr.format(tripCost(t))+'</div>'+statusPill(t.status)+'</div>'+a+'</div>';
}

function viewOverview(){
  var m=me(),mine=visibleTrips(),pend=pendingForMe();
  var upcoming=S.trips.filter(function(t){return t.status==='Approved'&&t.ret>=TODAY&&(m.role!=='employee'||t.emp===m.id)}).sort(function(a,b){return a.dep<b.dep?-1:1});
  var open=mine.filter(function(t){return t.status.indexOf('Pending')===0}).length;
  var q=S.trips.filter(function(t){return t.status==='Approved'}).reduce(function(s,t){return s+tripCost(t)},0);
  var tb=Object.keys(S.budgets).reduce(function(s,k){return s+S.budgets[k]},0);
  var h='<div class="stack"><div class="stats">';
  if(m.role!=='employee')h+='<div class="stat"><b>'+(pend.length+pendingExpForMe().length)+'</b><span>Waiting for your approval</span></div>';
  h+='<div class="stat"><b>'+open+'</b><span>Trip requests in review</span></div>'+
     '<div class="stat"><b>'+upcoming.length+'</b><span>Approved trips ahead</span></div>';
  if(m.role!=='employee')h+='<div class="stat"><b>'+inr.format(q)+'</b><span>Committed this quarter of '+inr.format(tb)+'</span></div>';
  h+='</div><div class="grid2"><section class="panel"><h2>Upcoming trips</h2>';
  h+=upcoming.length?upcoming.slice(0,4).map(function(t){return tripRow(t)}).join(''):'<p class="empty">No approved trips ahead. Start one from the Trips tab.</p>';
  h+='</section><section class="panel"><h2>'+(m.role==='employee'?'Your requests':'Needs a decision')+'</h2>';
  var list=m.role==='employee'?mine.filter(function(t){return t.status!=='Approved'}).slice(0,4):pend.slice(0,4);
  h+=list.length?list.map(function(t){return tripRow(t,{actions:true})}).join(''):'<p class="empty">Nothing waiting right now.</p>';
  return h+'</section></div></div>';
}

function viewTrips(){
  var list=visibleTrips().slice().sort(function(a,b){return a.dep<b.dep?1:-1});
  var m=me(),h='<div class="stack">';
  h+='<section class="panel"><div class="head"><h2>Trips'+(m.role==='employee'?'<small>Your requests</small>':'<small>All travellers</small>')+'</h2><button class="btn primary" data-act="newtrip">New trip request</button></div>';
  if(UI.form)h+=tripForm();
  h+=(list.length?list.map(function(t){return tripRow(t)}).join(''):'<p class="empty">No trips yet.</p>')+'</section></div>';
  return h;
}

function addDays(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function tripForm(){
  var m=me(),p=S.policy[m.grade];
  var opt=function(sel){return Object.keys(CITIES).map(function(c){return '<option value="'+c+'"'+(c===sel?' selected':'')+'>'+c+' &middot; '+CITIES[c]+'</option>'}).join('')};
  return '<form id="tripform" class="panel" style="background:var(--surface-2);margin-bottom:12px" novalidate><h2>New request <small>Grade '+m.grade+': up to '+CLASSES[p.cls]+', hotel '+inr.format(p.hotel)+'/night, allowance '+inr.format(p.da)+'/day</small></h2>'+
  '<div class="fields">'+
  '<div class="f"><label for="f-from">From</label><select id="f-from">'+opt('DEL')+'</select></div>'+
  '<div class="f"><label for="f-to">To</label><select id="f-to">'+opt('BOM')+'</select></div>'+
  '<div class="f"><label for="f-dep">Depart</label><input id="f-dep" type="date" min="'+TODAY+'" value="'+addDays(TODAY,7)+'"></div>'+
  '<div class="f"><label for="f-ret">Return</label><input id="f-ret" type="date" min="'+TODAY+'" value="'+addDays(TODAY,9)+'"></div>'+
  '<div class="f"><label for="f-cls">Travel class</label><select id="f-cls">'+CLASSES.map(function(c,i){return '<option value="'+i+'">'+c+'</option>'}).join('')+'</select></div>'+
  '<div class="f"><label for="f-fare">Round-trip fare (INR)</label><input id="f-fare" type="number" min="0" step="100" value="9000"></div>'+
  '<div class="f"><label for="f-hotel">Hotel per night (INR)</label><input id="f-hotel" type="number" min="0" step="100" value="5500"></div>'+
  '<div class="f"><label for="f-adv">Advance taken (INR)</label><input id="f-adv" type="number" min="0" step="100" value="0"></div>'+
  '<div class="f wide"><label for="f-purpose">Purpose of travel</label><input id="f-purpose" type="text" maxlength="120" placeholder="Client workshop, site visit, conference"></div></div>'+
  '<div class="est"><div><div class="meta">Estimated total</div><div class="tot" id="f-total">-</div></div><div id="f-check" class="meta" style="flex:1;min-width:200px"></div></div>'+
  '<div class="err" id="f-err" role="alert"></div>'+
  '<div class="formacts"><button class="btn primary" type="submit">Submit for approval</button><button class="btn" type="button" data-act="cancel">Cancel</button></div></form>';
}
function readForm(){
  var g=function(i){return document.getElementById(i).value};
  return {from:g('f-from'),to:g('f-to'),dep:g('f-dep'),ret:g('f-ret'),cls:+g('f-cls'),fare:+g('f-fare')||0,hotel:+g('f-hotel')||0,advance:+g('f-adv')||0,purpose:g('f-purpose').trim()};
}
function updateEst(){
  if(!document.getElementById('tripform'))return;
  var t=readForm(),m=me(),p=S.policy[m.grade];
  var ok=t.dep&&t.ret&&t.ret>=t.dep;
  document.getElementById('f-total').textContent=ok?inr.format(est(t,m.grade)):'-';
  var fl=[];
  if(t.cls>p.cls)fl.push('Class is above your limit');
  if(t.hotel>p.hotel)fl.push('Hotel is above your '+inr.format(p.hotel)+' cap');
  var el=document.getElementById('f-check');
  el.innerHTML=fl.length?'<span style="color:var(--warn)">Out of policy: '+fl.join('; ')+'. This request will also need finance approval.</span>':'Within policy. Your manager approves this request.';
}

var CITYCAT={'Delhi':'A','Gurgaon':'A','Noida':'A','Mumbai':'A','Kolkata':'A','Chennai':'A','Bengaluru':'A','Hyderabad':'A','Pune':'B','Ahmedabad':'B','Jaipur':'B','Lucknow':'B','Chandigarh':'B'};
var OTHERCITY='Other city';
var RATES={lodge:{A:4000,B:3250,C:3000},da:{A:600,B:550,C:400},own:{A:1250,B:1000,C:750},dep:{A:16800,B:15600,C:14400},da9:500,car:7.5,bike:3.5};
var SECTIONS={
  'Travel Mode':[['Own Conveyance - Car','car'],['Own Conveyance - Bike','bike'],['Flight',''],['Train',''],['Bus',''],['Taxi / Cab',''],['Other travel','']],
  'Stay':[['Hotel lodging (up to cap)','lodge'],['Own arrangement for lodging','own']],
  'Food':[['Breakfast',''],['Lunch',''],['Dinner',''],['Meals (with bill)','']],
  'DA':[['Daily allowance (DA)','da'],['Daily allowance, 9+ hrs travel','da9'],['Deputation allowance (per month)','dep']],
  'Misc.':[['Miscellaneous (with bill)',''],['Parking / toll',''],['Telephone / internet',''],['Other','']]};
function cityCat(c){return CITYCAT[c]||'C'}
function modeOpts(sec,sel){return (SECTIONS[sec]||[]).map(function(x){return '<option'+(x[0]===sel?' selected':'')+'>'+esc(x[0])+'</option>'}).join('')}
function modeInfo(sec,name){var l=SECTIONS[sec]||[];for(var i=0;i<l.length;i++){if(l[i][0]===name)return {name:name,key:l[i][1]}}return {name:name,key:''}}
function rateFor(key,cat){if(!key)return null;if(key==='car'||key==='bike'||key==='da9')return RATES[key];return RATES[key][cat]}
function unitFor(key){return {car:'km',bike:'km',lodge:'days',own:'days',da:'days',da9:'days',dep:'months'}[key]||'qty'}
function money(v,cur){try{return new Intl.NumberFormat('en-IN',{style:'currency',currency:cur||'INR',minimumFractionDigits:0,maximumFractionDigits:2}).format(v)}catch(e){return (cur||'')+' '+v}}
function fdy(iso){var p=(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):''}

function expRows(list,withActs,withClaim){
  var m=me();
  var h='<div class="scroll"><table><thead><tr><th>ID</th>'+(withClaim?'<th>Claim ID</th>':'')+'<th>Traveller</th><th>Dates</th><th>Route</th><th>Section / mode</th><th>City</th><th class="num">Qty &times; rate</th><th class="num">Amount</th><th>Remarks</th><th>Status</th>'+(withActs?'<th></th>':'')+'</tr></thead><tbody>';
  list.forEach(function(e){
    var act='';
    if(withActs){
      if(canActExp(e))act='<button class="btn sm ok" data-act="exp-ok" data-id="'+e.id+'">Approve</button> <button class="btn sm bad" data-act="exp-no" data-id="'+e.id+'">Reject</button>';
      else if(m.role==='admin'&&e.status==='Approved')act='<button class="btn sm" data-act="exp-pay" data-id="'+e.id+'">Mark reimbursed</button>';
    }
    var d1=e.dFrom||e.date,d2=e.dTo||d1,dates=d1===d2?fd(d1):fd(d1)+' to '+fd(d2);
    var route=(e.from||e.to)?esc(e.from||'-')+' &rarr; '+esc(e.to||'-'):'-';
    h+='<tr><td class="mono">'+e.id+'</td>'+(withClaim?'<td class="mono">'+(e.claimId?esc(e.claimId):'-')+'</td>':'')+'<td>'+esc(user(e.emp).name)+'</td><td>'+dates+'</td><td>'+route+'</td><td>'+esc(e.mode||e.cat)+'</td><td>'+esc(e.city||'-')+'</td><td class="num">'+(e.qty?e.qty+' &times; '+money(e.rate,e.cur):'-')+'</td><td class="num">'+money(e.amt,e.cur)+'</td><td>'+esc(e.note||'')+'</td><td>'+statusPill(e.status)+'</td>'+(withActs?'<td>'+act+'</td>':'')+'</tr>';
  });
  return h+'</tbody></table></div>';
}

function gridCalc(src){
  var q=function(i){return document.getElementById(i)};
  if(!q('g-sec'))return;
  var intl=UI.region==='intl',travel=q('g-sec').value==='Travel Mode';
  if(src==='sec')q('g-mode').innerHTML=modeOpts(q('g-sec').value,'');
  var mi=modeInfo(q('g-sec').value,q('g-mode').value),cat=cityCat(q('g-city').value);
  var fixed=intl?null:rateFor(mi.key,cat),rate=q('g-rate'),qty=q('g-qty'),amtEl=q('g-amt');
  q('g-cat').textContent=intl?'':'Category '+cat+' city';
  qty.placeholder=unitFor(mi.key);
  amtEl.readOnly=travel;amtEl.placeholder=travel?'':'Enter amount';
  if(src!=='rate'&&src!=='qty'&&src!=='cur'&&src!=='amt'){
    if(fixed!==null){rate.value=fixed;rate.readOnly=true;rate.dataset.auto='1'}
    else{
      rate.readOnly=false;
      if(!intl&&mi.key==='lodge'){rate.value=RATES.lodge[cat];rate.dataset.auto='1'}
      else if(rate.dataset.auto==='1'){rate.value='';rate.dataset.auto=''}
    }
    if(mi.key===''&&!qty.value)qty.value='1';
  }

/* ---------- Performance (PMS) ---------- */
var PMS_TYPES=['Setting New KRA','Mid Year Appraisal','Annual Appraisal'],PMS_YEARS=['2024-25','2025-26','2026-27'],PMS_TIMELINES=['Monthly','Daily','H1','H2','Yearly','Ongoing'];
var PMS_PAGES=['Page 1 - Quantitative Goals /Key Result Areas','Page 2 - Values assessment','Page 3 - Comments & scoring Key','Page 4 - Submission & approval status','Page 5 - Timelines','Page 6 - Send for approval'];
function pnum(v){if(v===''||v==null)return null;var n=Number(v);return isFinite(n)?n:null}
function pmsCalc(r){
  var t=pnum(r.target),w=pnum(r.weight)||0,th=pnum(r.threshold),m=pnum(r.mgrAch),eff=m!=null?m:pnum(r.selfAch);
  if(eff==null||!t)return {pct:0,score:0};
  var pct=Math.min(100,eff/t*100);
  return {pct:pct,score:(th!=null&&pct<th)?0:w*pct/100};
}
function pmsInit(p){
  UI.pms=UI.pms||{};UI.pms.p=p;UI.pms.dirty=false;UI.pms.loading=false;UI.pms.err='';UI.pms.msg='';
  UI.pms.emp=p.employee.id;UI.pms.type=p.appraisal.type;UI.pms.year=p.appraisal.year;
  UI.pms.vrows=((p.values&&p.values.rows)||[]).map(function(r){return {ord:r.ord,lvl:r.lvl,code:r.code||'',label:r.label,marks:pnum(r.marks),selfAch:pnum(r.selfAch)==null?'':pnum(r.selfAch),mgrAch:pnum(r.mgrAch)==null?'':pnum(r.mgrAch),remarks:r.remarks||''}});
  UI.pms.vweight=p.values&&p.values.weight!=null?Number(p.values.weight):20;UI.pms.page=UI.pms.page||1;UI.pms.editor=null;
  UI.pms.cm=Object.assign({appraiser:'',action:'',reviewer:'',appraisee:'',hr:''},p.comments||{});
  UI.pms.rows=p.kras.map(function(k){return {id:k.id,sno:k.sno,kra:k.kra,source:k.source,threshold:pnum(k.threshold)==null?'':pnum(k.threshold),target:pnum(k.target)==null?'':pnum(k.target),weight:pnum(k.weight)==null?'':pnum(k.weight),timeline:k.timeline,selfAch:pnum(k.selfAch)==null?'':pnum(k.selfAch),mgrAch:pnum(k.mgrAch)==null?'':pnum(k.mgrAch),remarks:k.remarks}});
}
function pmsOpen(emp,type,year){
  UI.pms=UI.pms||{};UI.pms.loading=true;
  api('POST','/api/pms/open',{emp:emp||UI.uid,type:type||'Setting New KRA',year:year||'2025-26'}).then(function(p){pmsInit(p);render()}).catch(function(e){UI.pms.loading=false;UI.pms.err=e.message||'Could not open the appraisal.';fail(e);render()});
}
function fd(iso){return iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):''}
function pmsRowHtml(r,i,can){
  var ro=function(on){return on?'':' readonly tabindex="-1"'},goal=can.self||can.mgr,c=pmsCalc(r);
  var inp=function(f,v,ed,extra){return '<input class="kin" data-kf="'+f+'" data-i="'+i+'" value="'+esc(v)+'"'+ro(ed)+(extra||'')+'>'};
  var sel='<select class="kin" data-kf="timeline" data-i="'+i+'"'+(goal?'':' disabled')+'>'+PMS_TIMELINES.map(function(t){return '<option'+(r.timeline===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select>';
  return '<tr data-row="'+i+'"><td class="kc"><div>'+(i+1<10?'0':'')+(i+1)+'</div>'+(goal?'<button type="button" class="linkbtn kdel" data-act="pms-del" data-id="'+i+'" title="Remove this row" aria-label="Remove row '+(i+1)+'">&times;</button>':'')+'</td>'+
    '<td><textarea class="kin kta" data-kf="kra" data-i="'+i+'" rows="2"'+ro(goal)+' aria-label="Key Result Area '+(i+1)+'">'+esc(r.kra)+'</textarea></td>'+
    '<td>'+inp('source',r.source,goal)+'</td><td>'+inp('threshold',r.threshold,goal,' inputmode="decimal"')+'</td><td>'+inp('target',r.target,goal,' inputmode="decimal"')+'</td><td>'+inp('weight',r.weight,goal,' inputmode="decimal"')+'</td>'+
    '<td>'+sel+'</td><td>'+inp('selfAch',r.selfAch,can.self&&can.rate,' inputmode="decimal"')+'</td><td>'+inp('mgrAch',r.mgrAch,can.mgr&&can.rate,' inputmode="decimal"')+'</td>'+
    '<td class="kn" id="kp'+i+'">'+c.pct.toFixed(2)+'</td><td class="kn" id="ks'+i+'">'+c.score.toFixed(2)+'</td>'+
    '<td><textarea class="kin kta" data-kf="remarks" data-i="'+i+'" rows="2"'+ro(goal)+' aria-label="Specific remarks '+(i+1)+'">'+esc(r.remarks)+'</textarea></td></tr>';
}
function pmsTotals(){
  var rows=UI.pms.rows,w=0,sc=0;rows.forEach(function(r,i){w+=pnum(r.weight)||0;sc+=pmsCalc(r).score});
  return {w:w,score:sc};
}
function viewPms(){
  var P=UI.pms;
  if(!P||!P.p){
    if(!P||!P.loading){if(P&&P.err)return win('<p class="meta" style="padding:12px">'+esc(P.err)+'</p><button class="wbtn" type="button" data-act="pms-retry">Try again</button>','KRA');pmsOpen()}
    return win('<p class="meta" style="padding:12px">Opening your appraisal...</p>','KRA');
  }
  var p=P.p,e=p.employee,can=p.blocked?{self:false,mgr:false,rate:false}:{self:p.can.self,mgr:p.can.mgr,rate:P.type!=='Setting New KRA'},tt=pmsTotals();
  var opts=function(list,cur){return list.map(function(x){return '<option'+(x===cur?' selected':'')+'>'+x+'</option>'}).join('')};
  var nameField=p.team.length?'<select class="wf live" id="pms-emp" aria-label="Name of Employee"><option value="'+esc(UI.uid)+'"'+(P.emp===UI.uid?' selected':'')+'>'+esc(me().name)+' (me)</option>'+p.team.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===P.emp?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select>':'<input class="wf" readonly aria-label="Name of Employee" value="'+esc(e.name)+'">';
  var f=function(l,v){return '<div class="phl">'+l+'</div><input class="wf phv" readonly aria-label="'+l+'" value="'+esc(v||'')+'">'};
  var hdr='<div class="phead"><div class="phl">Type :</div><select class="wf live phv" id="pms-type" aria-label="Type">'+opts(PMS_TYPES,P.type)+'</select>'+
    '<div class="phl">Name of Employee :</div>'+nameField+
    '<div class="phl">Department</div><input class="wf phv" readonly aria-label="Department" value="'+esc(e.dept)+'">'+
    '<div class="phl">Current Role</div><input class="wf phv" readonly aria-label="Current Role" value="'+esc(e.curRole)+'">'+
    '<div class="phl">Year of Appraisal:</div><select class="wf live phv" id="pms-year" aria-label="Year of Appraisal">'+opts(PMS_YEARS,P.year)+'</select>'+
    '<div class="phl">Designation:</div><input class="wf phv" readonly aria-label="Designation" value="'+esc(e.desig)+'">'+
    '<div class="phl">Reporting Manager:</div><input class="wf phv" readonly aria-label="Reporting Manager" value="'+esc(e.manager)+'">'+
    '<div class="phl">Date of Joining</div><input class="wf phv" readonly aria-label="Date of Joining" value="'+esc(fd(e.doj))+'"></div>';
  var tabs='<div class="ptabs">'+PMS_PAGES.map(function(t,i){var live=i<3;return '<button type="button" class="ptab'+(i+1===P.page?' on':'')+'"'+(live?' data-act="pms-page" data-v="'+(i+1)+'"':' disabled title="Coming soon"')+'>'+esc(t)+'</button>'}).join('')+'</div>';
  if(P.page===2)return win(tabs+hdr+viewPmsValues(P,p,can),'KRA');
  if(P.page===3)return win(tabs+hdr+viewPmsComments(P,p,can),'KRA');
  var cols=[3,24,8,6,7,6,8,8,8,6,6,10];
  var th='<thead><tr class="kl">'+'ABCDEFGHIJKL'.split('').map(function(l){return '<th>('+l+')</th>'}).join('')+'</tr><tr class="kh"><th></th><th>Key Result Area\'s (Quantitative Goals)</th><th>Source</th><th>Threshold</th><th>Planned Achievement /Target</th><th>Weightage of the KRA</th><th>Timeline/ Periodicity</th><th>Actual Self rating</th><th>Actual Manager rating</th><th>% age</th><th>Score</th><th>Specific Remarks</th></tr>'+
    '<tr class="ks"><th>S. No</th><th></th><th>WFX/Excel Sheet/ E-mails/ Files/ Hardcopy Record etc.</th><th>% achievement below which score will be zero.</th><th>INR/USD/ %age/ Score/ Raw numbers</th><th>Total = 100%</th><th>Monthly/Daily/ H1/H2/ Yearly/ ongoing</th><th>Achievement (As per appraisee)</th><th>Achievement (As per Appraiser)</th><th>Achievement in %age</th><th>Net score</th><th></th></tr></thead>';
  var body=P.rows.map(function(r,i){return pmsRowHtml(r,i,can)}).join('')||'<tr><td colspan="12" class="emptyc">No Key Result Areas yet. Press Add to create the first one.</td></tr>';
  var grid='<div class="kscroll"><table class="kgrid"><colgroup>'+cols.map(function(w){return '<col style="width:'+w+'%">'}).join('')+'</colgroup>'+th+'<tbody id="pms-body">'+body+'</tbody></table></div>';
  var role=p.blocked?p.blocked:!can.rate?'Setting goals: add the Key Result Areas, targets and weightage. Ratings are entered in the Mid Year and Annual appraisals.':can.self&&!can.mgr?'You are filling in your own appraisal: you can edit the goals and your self rating.':(can.mgr?'You are the reporting manager: you can edit the goals and the manager rating.':'');
  var foot='<div class="pfoot"><input class="wf pno" readonly aria-label="PMS number" placeholder="Generated on save" value="'+esc(p.appraisal.no||'')+'"><button class="wbtn" type="button" data-act="pms-save"'+(p.blocked?' disabled':'')+'>Save</button><button class="wbtn" type="button" data-act="pms-add"'+(p.blocked?' disabled':'')+'>Add</button>'+
    '<span class="pmsg" id="pms-msg" role="status">'+esc(P.msg||role)+'</span>'+
    '<span class="ptot">Total = <input class="wf" id="pms-w" readonly aria-label="Total weightage" value="'+tt.w.toFixed(2)+'"'+(Math.abs(tt.w-100)>0.001?' style="color:var(--bad)"':'')+'></span>'+
    '<span class="ptot">Score <input class="wf" id="pms-s" readonly aria-label="Total score" value="'+tt.score.toFixed(2)+'"><input class="wf" id="pms-s5" readonly title="Final score = Total score / 100 &times; 80" aria-label="Final score" value="'+(tt.score/100*80).toFixed(2)+'"></span></div>';
  setTimeout(function(){var g=document.querySelector('.kscroll');if(g)g.style.height='';pmsStick();pmsFit()},0);
  return win(tabs+hdr+grid+foot,'KRA');
}

function pmsValTotals(){
  var P=UI.pms,max=0,s=0,m=0,eff=0;
  P.vrows.forEach(function(r){if(r.marks==null)return;max+=Number(r.marks);var a=pnum(r.selfAch),b=pnum(r.mgrAch);s+=a||0;m+=b||0;eff+=(b!=null?b:(a||0))});
  return {max:max,self:s,mgr:m,eff:eff,w:max?eff/max*P.vweight:0};
}
function valLabel(r){
  var ln=String(r.label||'').split('\n'),h='<div class="vt">'+esc(ln[0])+'</div>';
  for(var k=1;k<ln.length;k++)h+='<div class="vs">'+esc(ln[k])+'</div>';
  return h;
}
function pmsValRow(r,i,can){
  var rate=r.marks!=null,cls=r.lvl===1?'v1':r.lvl===2?'v2':'v3',bad=function(v){var n=pnum(v);return n!=null&&(n<0||n>Number(r.marks))};
  var inp=function(f,v,ed){return rate?'<input class="kin vin'+(bad(v)?' bad':'')+'" data-vf="'+f+'" data-i="'+i+'" value="'+esc(v)+'"'+(ed?'':' readonly tabindex="-1"')+' inputmode="decimal" aria-label="'+(f==='selfAch'?'Self rating':'Manager rating')+' for '+esc(r.label)+'">':''};
  return '<tr class="'+cls+'"><td class="kc">'+esc(r.code)+'</td><td class="vl">'+valLabel(r)+'</td><td class="kn">'+(rate?Number(r.marks).toFixed(2):'')+'</td>'+
    '<td>'+inp('selfAch',r.selfAch,can.self&&can.rate)+'</td><td>'+inp('mgrAch',r.mgrAch,can.mgr&&can.rate)+'</td>'+
    '<td>'+(rate?'<textarea class="kin kta" rows="1" data-vf="remarks" data-i="'+i+'"'+(can.mgr&&can.rate?'':' readonly tabindex="-1"')+' aria-label="Remarks for '+esc(r.label)+'">'+esc(r.remarks)+'</textarea>':'')+'</td></tr>';
}
function viewPmsValues(P,p,can){
  setTimeout(function(){var g=document.querySelector('.kscroll');if(g)g.style.height='';pmsFit()},0);
  if(P.editor)return viewPmsEditor(P);
  var t=pmsValTotals(),isAdmin=me().role==='admin';
  var th='<thead><tr><th>S. No</th><th>B - Qualitative Attributes ( Weightage : '+esc(String(P.vweight))+' )</th><th>Marks</th><th>Actual Self Rating</th><th>Actual Manager Rating</th><th>Reporting Manager\'s Remarks wrt to attribute</th></tr></thead>';
  var body=P.vrows.map(function(r,i){return pmsValRow(r,i,can)}).join('')||'<tr><td colspan="6" class="emptyc">No attributes are set up yet.</td></tr>';
  var grid='<div class="kscroll"><table class="kgrid vgrid"><colgroup><col style="width:5%"><col style="width:43%"><col style="width:8%"><col style="width:9%"><col style="width:9%"><col style="width:26%"></colgroup>'+th+'<tbody>'+body+'</tbody></table></div>';
  var role=p.blocked?p.blocked:!can.rate?'Ratings for the values are entered in the Mid Year and Annual appraisals.':can.self&&!can.mgr?'You can enter your self rating (not more than the marks of each line).':(can.mgr?'You are the reporting manager: you can enter the manager rating and your remarks.':'');
  var off=(p.blocked||!can.rate)?' disabled':'';
  var foot='<div class="pfoot"><input class="wf pno" readonly aria-label="PMS number" placeholder="Generated on save" value="'+esc(p.appraisal.no||'')+'"><button class="wbtn" type="button" data-act="pms-save"'+off+'>Save</button>'+
    (isAdmin?'<button class="wbtn" type="button" data-act="ve-open">Edit attributes</button>':'')+
    '<span class="pmsg pnote" id="pms-msg" role="status">'+esc(P.msg||role)+'</span>'+
    '<span class="ptot">Score ( out of max <span id="pv-maxl">'+t.max.toFixed(2).replace(/\.00$/,'')+'</span> ) <input class="wf" id="pv-max" readonly aria-label="Total marks" value="'+t.max.toFixed(2)+'"><input class="wf" id="pv-self" readonly aria-label="Total self rating" value="'+t.self.toFixed(2)+'"><input class="wf" id="pv-mgr" readonly aria-label="Total manager rating" value="'+t.mgr.toFixed(2)+'"><input class="wf" id="pv-w" readonly title="Weighted score out of '+esc(String(P.vweight))+' = manager rating (self rating where there is none) / total marks x '+esc(String(P.vweight))+'" aria-label="Weighted score" value="'+t.w.toFixed(2)+'"></span></div>';
  return grid+foot;
}
// ---------- Page 3: comments & scoring key ----------
var PMS_KEY=[['> 40%',1,'Poor Performance'],['41% - 60%',2,'Below Average'],['61% - 80%',3,'Average Performance'],['81% - 94%',4,'Good Performance'],['95% - 100%',5,'Outstanding']];
function viewPmsComments(P,p,can){
  setTimeout(function(){var g=document.querySelector('.kscroll');if(g)g.style.height='';pmsFit()},0);
  // Score = A (quantitative goals, out of 100) + B (values rating, out of the total marks of the values list). Percentage = Score / (100 + marks) x 100.
  var A=pmsTotals().score,V=pmsValTotals(),tot=A+V.eff,den=100+V.max,pct=den?tot/den*100:0,maxTxt=String(Number(V.max.toFixed(2)));
  var tip='Score = A + B. A = total score of the quantitative goals (out of 100). B = rating for the values (out of '+maxTxt+'). Percentage = Score / '+String(Number(den.toFixed(2)))+' x 100.';
  var noNo=!p.appraisal.no,locked=p.appraisal.status!=='Draft',off=!!p.blocked||noNo||locked;
  var ed={appraiser:can.mgr&&!off,action:can.mgr&&!off,reviewer:false,appraisee:can.self&&!off,hr:false};
  var sum='<table class="ctab csum"><colgroup><col style="width:54%"><col style="width:18%"><col style="width:28%"></colgroup>'+
    '<tr><th>Overall Score</th><th>Score</th><th>Overall score in percentage</th></tr>'+
    '<tr><td class="cl"><div>Total Score</div><div>( A+B )</div></td>'+
    '<td class="cy"><input class="cyi" id="pc-score" readonly title="'+esc(tip)+'" aria-label="Total score" value="'+tot.toFixed(2)+'"></td>'+
    '<td class="cy"><input class="cyi" id="pc-pct" readonly title="'+esc(tip)+'" aria-label="Overall score in percentage" value="'+pct.toFixed(4)+'"></td></tr></table>';
  var box=function(key,label,rows,join){return '<div class="cbox'+(join?' cj':'')+'"><div class="cbh">'+esc(label)+'</div><textarea class="cta" data-cf="'+key+'" rows="'+rows+'" maxlength="4000"'+(ed[key]?'':' readonly tabindex="-1"')+' aria-label="'+esc(label)+'">'+esc(P.cm[key])+'</textarea></div>'};
  var keyRows=PMS_KEY.map(function(r){return '<tr><td class="cc">'+esc(r[0])+'</td><td class="cc">'+r[1]+'</td><td>'+esc(r[2])+'</td></tr>'}).join('');
  var keyT='<table class="ctab ckt"><colgroup><col style="width:54%"><col style="width:18%"><col style="width:28%"></colgroup>'+
    '<tr><th>Actual Achievement ( in terms of %age)</th><th>Rating</th><th class="cdl">Description</th></tr>'+keyRows+'</table>';
  var page='<div class="cpage">'+sum+
    box('appraiser','Comments - Appraiser (Immediate/Reporting Manager)',3,false)+
    box('action','Any specific action  (Training/Change in Role/ Specific Project /PIP, etc)',2,true)+
    '<div class="cgap"></div>'+box('reviewer',"Comments - Reviewer ( Manager's Manager + HOD)",2,false)+
    '<div class="cgap"></div>'+box('appraisee',"Comments from the Appraisee (Employee's overall appraisal process feedback)",2,false)+
    '<div class="cgap"></div>'+box('hr','Comment from HR',2,false)+
    '<div class="ckey">Indicative key to arrive at scores</div>'+keyT+'</div>';
  var role=p.blocked?p.blocked:noNo?'Save the goals on Page 1 first (this creates the PMS number), then write the comments here.':locked?'This appraisal is locked.':
    can.mgr?'You are the reporting manager: you can write the Appraiser comments and the specific action. The Reviewer and HR comments are added later in the process.':
    can.self?'You can write your feedback on the appraisal process in the Appraisee box.':'';
  var foot='<div class="pfoot"><input class="wf pno" readonly aria-label="PMS number" placeholder="Generated on save" value="'+esc(p.appraisal.no||'')+'"><button class="wbtn" type="button" data-act="pms-save"'+(off?' disabled':'')+'>Save</button>'+
    '<span class="pmsg pnote" id="pms-msg" role="status">'+esc(P.msg||role)+'</span></div>';
  return '<div class="kscroll cs">'+page+'</div>'+foot;
}
function viewPmsEditor(P){
  var E=P.editor,lv=function(v){return [[1,'Main value'],[2,'Sub heading'],[3,'Behaviour line']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>'}).join('')};
  var rows=E.rows.map(function(r,i){return '<tr><td><select class="kin" data-ef="lvl" data-i="'+i+'" aria-label="Level">'+lv(r.lvl)+'</select></td>'+
    '<td><input class="kin" data-ef="code" data-i="'+i+'" value="'+esc(r.code)+'" maxlength="10" aria-label="S. No"></td>'+
    '<td><textarea class="kin kta" rows="3" data-ef="label" data-i="'+i+'" maxlength="1000" aria-label="Text">'+esc(r.label)+'</textarea></td>'+
    '<td><input class="kin" style="text-align:right" data-ef="marks" data-i="'+i+'" value="'+esc(r.marks==null?'':r.marks)+'" inputmode="decimal" aria-label="Marks"></td>'+
    '<td class="kc" style="white-space:nowrap"><button type="button" class="vbtn" data-act="ve-up" data-id="'+i+'" title="Move up" aria-label="Move up">&uarr;</button> <button type="button" class="vbtn" data-act="ve-down" data-id="'+i+'" title="Move down" aria-label="Move down">&darr;</button> <button type="button" class="vbtn" data-act="ve-del" data-id="'+i+'" title="Remove this line" aria-label="Remove line">&times;</button></td></tr>'}).join('');
  var th='<thead><tr><th>Level</th><th>S. No</th><th>Attribute (title, then lines under it)</th><th>Marks (empty = heading only)</th><th></th></tr></thead>';
  var grid='<div class="kscroll"><table class="kgrid vgrid vedit"><colgroup><col style="width:14%"><col style="width:7%"><col style="width:57%"><col style="width:12%"><col style="width:10%"></colgroup>'+th+'<tbody>'+rows+'</tbody></table></div>';
  var tot=E.rows.reduce(function(a,r){return a+(pnum(r.marks)||0)},0);
  var foot='<div class="pfoot"><button class="wbtn" type="button" data-act="ve-save">Save list</button><button class="wbtn" type="button" data-act="ve-add">Add line</button><button class="wbtn" type="button" data-act="ve-cancel">Cancel</button>'+
    '<span class="pmsg pnote" id="pms-msg" role="status">'+esc(E.msg||'First line = title (bold); press Enter for the lines under it. Changes apply to appraisals with no ratings saved yet; started ones keep their own list.')+'</span>'+
    '<span class="ptot">Weightage <input class="wf" id="ve-w" value="'+esc(String(E.weight))+'" inputmode="decimal" aria-label="Weightage" style="width:60px"></span><span class="ptot">Total marks <input class="wf" id="ve-t" readonly value="'+tot.toFixed(2)+'"></span></div>';
  return grid+foot;
}
// Stretch the grid so the Save / Add / Total row ends just above the bottom of the screen (the taskbar), whatever the screen size or zoom.
function pmsFit(){
  var g=document.querySelector('.kscroll');if(!g)return;
  var w=g.closest('.win'),room=window.innerHeight-(w||g).getBoundingClientRect().bottom-8;
  var h=Math.max(230,g.getBoundingClientRect().height+room);
  g.style.height=h+'px';
}
window.addEventListener('resize',function(){var g=document.querySelector('.kscroll');if(g){g.style.height='';pmsFit()}});
function pmsStick(){
  var a=document.querySelector('.kgrid tr.kl'),b=document.querySelector('.kgrid tr.kh'),c=document.querySelector('.kgrid tr.ks');if(!a||!b||!c)return;
  var h1=a.getBoundingClientRect().height,h2=b.getBoundingClientRect().height;
  [].forEach.call(b.children,function(x){x.style.top=h1+'px'});[].forEach.call(c.children,function(x){x.style.top=(h1+h2)+'px'});
}
function pmsEdit(el){
  if(el.hasAttribute('data-cf')){var P6=UI.pms;if(!P6||!P6.cm)return;P6.cm[el.getAttribute('data-cf')]=el.value;P6.dirty=true;pmsMsg('');return}

    vr[vf]=el.value;P0.dirty=true;

  var i=Number(el.getAttribute('data-i')),f=el.getAttribute('data-kf');if(!P.rows[i])return;
  P.rows[i][f]=el.value;P.dirty=true;

function viewPolicy(){
  var m=me(),edit=m.role==='admin';
  var h='<div class="stack"><section class="panel"><h2>Travel policy by grade'+(edit?'<small>Edit the hotel cap and allowance</small>':'')+'</h2><div class="scroll"><table><thead><tr><th>Grade</th><th>Flight class</th><th class="num">Hotel cap / night</th><th class="num">Daily allowance</th></tr></thead><tbody>';
  Object.keys(S.policy).forEach(function(g){var p=S.policy[g];
    h+='<tr><td><b>'+g+'</b></td><td>Up to '+CLASSES[p.cls]+'</td><td class="num">'+(edit?'<input type="number" min="0" step="500" data-pol="'+g+'" data-k="hotel" value="'+p.hotel+'" aria-label="Hotel cap for '+g+'">':inr.format(p.hotel))+'</td><td class="num">'+(edit?'<input type="number" min="0" step="100" data-pol="'+g+'" data-k="da" value="'+p.da+'" aria-label="Daily allowance for '+g+'">':inr.format(p.da))+'</td></tr>';});
  h+='</tbody></table></div></section><section class="panel"><h2>Department budgets<small>Q4, October to December 2026</small></h2>';
  Object.keys(S.budgets).forEach(function(d){
    var c=0,pd=0;
    S.trips.forEach(function(t){if(user(t.emp).dept!==d)return;if(t.status==='Approved')c+=tripCost(t);else if(t.status.indexOf('Pending')===0)pd+=tripCost(t)});
    var b=S.budgets[d],cp=Math.min(100,c/b*100),pp=Math.min(100-cp,pd/b*100);
    h+='<div class="bud"><div class="l"><b>'+esc(d)+'</b><span class="meta">'+inr.format(c)+' committed &middot; '+inr.format(pd)+' pending &middot; of '+inr.format(b)+'</span></div><div class="track" role="img" aria-label="'+esc(d)+' budget use"><div class="seg-c" style="width:'+cp+'%"></div><div class="seg-p" style="width:'+pp+'%"></div></div></div>';
  });
  return h+'</section></div>';
}

function render(){

  if(!m)return;
  document.getElementById('whoami').textContent=m.name+' ('+(m.role==='manager'?'HOD':m.role==='admin'?'Finance':'Employee')+')';
  if(UI.mod!=='pms'&&UI.mod!=='travel')UI.mod='travel';
  var tabs;
  if(UI.mod==='pms'){tabs=[['pms','KRA Appraisal']];UI.tab='pms'}
  else{
    tabs=[['overview','Overview'],['trips','Trips']];
    if(m.role!=='employee')tabs.push(['approvals','Approvals']);
    tabs.push(['center','Approval Center'],['expenses','Expenses'],['policy','Policy and budgets']);
    if(!tabs.some(function(t){return t[0]===UI.tab}))UI.tab='overview';
  }
  var ft=document.querySelector('.foot');if(ft)ft.style.display=UI.mod==='pms'?'none':'';document.body.style.paddingBottom=UI.mod==='pms'?'6px':'';
  document.getElementById('brandh').textContent=UI.mod==='pms'?'Performance':'Travel Desk';
  document.getElementById('brands').textContent=UI.mod==='pms'?'Goals, appraisals and ratings':'Requests, approvals and expenses';

    return '<button class="tab" role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(UI.tab===t[0])+'">'+t[1]+(t[0]==='approvals'&&pc?'<span class="badge">'+pc+'</span>':'')+(t[0]==='center'&&pendingCenterCount()?'<span class="badge">'+pendingCenterCount()+'</span>':'')+'</button>'}).join('');
  var v={overview:viewOverview,trips:viewTrips,approvals:viewApprovals,center:viewCenter,pms:viewPms,expenses:viewExpenses,policy:viewPolicy}[UI.tab];

function decide(id,yes){
  api('POST','/api/trips/'+encodeURIComponent(id)+'/decision',{approve:yes}).then(function(r){
    return load().then(function(){toast(id+(r.status==='Approved'?' approved':r.status==='Rejected'?' rejected':' sent to finance'));render()})
  }).catch(function(e){fail(e);load().then(render).catch(function(){})});
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(a==='mod'){UI.mod=b.getAttribute('data-v')==='pms'?'pms':'travel';UI.tab=UI.mod==='pms'?'pms':'overview';UI.form=false;UI.expForm=false;UI.report=null;try{localStorage.setItem('td-mod',UI.mod)}catch(x){}}

  else if(a==='newexp'){UI.expForm=true}
  else if(a==='cancel'){UI.form=false;UI.expForm=false}

      UI.expTab='new';UI.step='enter';UI.last=null;UI.region='dom';UI.claimId=null;UI.lv=null;UI.task=null;UI.fstat='';
      setTimeout(function(){var f0=document.getElementById('g-df');if(f0)f0.focus()},0)});

    var back=function(){document.title=old;window.removeEventListener('afterprint',back)};window.addEventListener('afterprint',back);

    if(!cl||!(cl.files||[]).length){setStat('Attach at least one invoice.');return}
    if(!lv.l1){setStat('Select the L1 Manager email id.');return}
    return run(api('POST','/api/claims/submit',{claim:UI.claimId,l1:lv.l1,l2:lv.l2||'',l3:lv.l3||''}),function(r){return 'Travel request '+r.id+' submitted ('+r.submitted+' row'+(r.submitted===1?'':'s')+')'},function(){UI.step='enter';UI.expTab='hist';UI.last=null;UI.task=null;UI.claimId=null;UI.lv=null;UI.fstat=''});}
  else if(a==='claim-ok'||a==='claim-no'){
    return run(api('POST','/api/claims/decision',{emp:id,approve:a==='claim-ok'}),'Claim '+(a==='claim-ok'?'approved':'rejected'));}
  render();
  if(a==='newtrip'||a==='newexp'){var f=document.querySelector('#tripform,#expform');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest'})}
});

document.addEventListener('input',function(e){
  var t0=e.target;
  if(t0.hasAttribute&&(t0.hasAttribute('data-kf')||t0.hasAttribute('data-vf')||t0.hasAttribute('data-ef')||t0.hasAttribute('data-cf'))){pmsEdit(t0);return}
  if(t0.id==='ap-q'){UI.apQ=t0.value;var tb=document.getElementById('ap-tbody');if(tb)tb.innerHTML=apRows();return}
  if(t0.classList&&t0.classList.contains('ap-rem')){UI.apRem=UI.apRem||{};UI.apRem[t0.getAttribute('data-id')]=t0.value;return}
  if(e.target.closest&&e.target.closest('#tripform'))updateEst();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-kf')){pmsEdit(t);return}
  if(t.id==='pms-emp'||t.id==='pms-type'||t.id==='pms-year'){pmsSwitch();return}
  if(t.classList&&t.classList.contains('ap-chk')){UI.apChk=UI.apChk||{};UI.apChk[t.getAttribute('data-id')]=t.checked;return}
  if(t.id==='inv-file'){uploadFiles(t.files);t.value='';return}
  if(t.id&&/^f-l[123]$/.test(t.id)){UI.lv=UI.lv||{};UI.lv[t.id.slice(2)]=t.value;return}
  if(t.hasAttribute&&t.hasAttribute('data-pol')){
    var g=t.getAttribute('data-pol'),k=t.getAttribute('data-k'),cur=S.policy[g],nv={hotel:cur.hotel,da:cur.da};nv[k]=Math.max(0,+t.value||0);
    run(api('PUT','/api/policy/'+encodeURIComponent(g),nv),'Policy updated');
  }
  if(t.closest&&t.closest('#tripform'))updateEst();
});

document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='loginform')return doLogin();
  if(e.target.id==='pwform')return doPassword();
  var m=me();
  if(e.target.id==='tripform'){
    var t=readForm(),err=document.getElementById('f-err');
    if(!t.purpose){err.textContent='Add a purpose so your approver knows why you are travelling.';return}
    if(t.from===t.to){err.textContent='Choose different cities for From and To.';return}
    if(!t.dep||!t.ret||t.ret<t.dep){err.textContent='Return date must be on or after the departure date.';return}
    if(t.dep<TODAY){err.textContent='Departure cannot be in the past.';return}
    if(t.fare<=0){err.textContent='Enter the round-trip fare.';return}
    run(api('POST','/api/trips',{from:t.from,to:t.to,dep:t.dep,ret:t.ret,purpose:t.purpose,cls:t.cls,fare:t.fare,hotel:t.hotel,advance:t.advance}),function(r){return r.id+' submitted'},function(){UI.form=false});
  }else if(e.target.id==='gridform'){
    var q=function(i){return document.getElementById(i)},err=q('g-err'),intl=UI.region==='intl';
    var sec=q('g-sec').value,modeName=q('g-mode').value,mi=modeInfo(sec,modeName),city=q('g-city').value,cat=cityCat(city);
    var row={dFrom:q('g-df').value,dTo:q('g-dt').value,from:q('g-from').value.trim(),to:q('g-to').value.trim(),qty:+q('g-qty').value,rate:+q('g-rate').value,cur:q('g-cur').value,note:q('g-rem').value.trim()};
    if(!row.dFrom||!row.dTo){err.textContent='Enter both dates.';return}
    if(row.dTo<row.dFrom){err.textContent='Date/To cannot be before Date/From.';return}
    if(sec==='Travel Mode'&&(!row.from||!row.to)){err.textContent='Enter the From and To locations for travel.';return}
    var travel=sec==='Travel Mode',fixed=intl?null:rateFor(mi.key,cat),amtIn=+q('g-amt').value;
    if(travel){
      if(!(row.qty>0)){err.textContent='Enter the '+unitFor(mi.key)+'. It must be more than zero.';return}
      if(!(row.rate>0)){err.textContent='Enter the rate or the amount per unit.';return}
      row.amt=Math.round(row.qty*row.rate*100)/100;
    }else{
      if(!intl&&(fixed!==null||mi.key==='lodge')&&!(row.qty>0)){err.textContent='Enter the number of '+unitFor(mi.key)+'.';return}
      if(!(amtIn>0)){err.textContent='Enter the amount.';return}
      if(!(row.qty>0))row.qty=1;
      var lim=intl?null:(fixed!==null?fixed:(mi.key==='lodge'?RATES.lodge[cat]:null));
      if(lim!==null){var cap=Math.round(row.qty*lim*100)/100;if(amtIn>cap+0.005){err.textContent='Amount is above the policy limit of '+money(cap,'INR')+' for '+row.qty+' '+unitFor(mi.key)+(mi.key==='lodge'?' in a Category '+cat+' city':'')+'.';return}}
      row.amt=Math.round(amtIn*100)/100;
      if(!(row.rate>0))row.rate=Math.round(row.amt/row.qty*100)/100;
    }
    if(sec==='Misc.'&&!row.note){err.textContent='Add a remark for miscellaneous expenses.';return}
    var tripSel=q('g-trip')?q('g-trip').value:'';
    run(api('POST','/api/expenses',{trip:tripSel,section:sec,mode:modeName,dFrom:row.dFrom,dTo:row.dTo,from:row.from,to:row.to,city:city,qty:row.qty,rate:row.rate,amt:row.amt,cur:row.cur,note:row.note,region:UI.region}),'Row added',function(){
      UI.last={sec:sec,mode:modeName,city:city,from:row.from,to:row.to,dFrom:row.dTo,trip:tripSel};
      setTimeout(function(){var f1=document.getElementById('g-dt');if(f1)f1.focus()},0)});
  }
});

document.addEventListener('input',function(ev){var t=ev.target;if(t.id==='g-qty')gridCalc('qty');else if(t.id==='g-rate')gridCalc('rate');else if(t.id==='g-amt')gridCalc('amt')});
document.addEventListener('change',function(ev){
  var t=ev.target,mp={'g-sec':'sec','g-mode':'mode','g-city':'city','g-cur':'cur'};
  if(mp[t.id])gridCalc(mp[t.id]);
  if(t.name==='region'){UI.region=t.value;UI.last=null;render()}
});

document.getElementById('reset').addEventListener('click',function(){
  run(api('POST','/api/reset'),'Example data restored',function(){UI.form=false;UI.expForm=false;UI.tab='overview'});
});
if(location.search.indexOf('reset')<0)document.getElementById('reset').hidden=true;

// ---------- sign-in screens ----------
function showScreen(n){document.querySelector('.wrap').hidden=(n!=='app');document.getElementById('auth').hidden=(n==='app')}
function authShell(inner){return '<div class="authbox"><div class="authstub"><span>TRAVEL DESK</span><span>EXPENSES &middot; APPROVALS</span></div><div class="authbody">'+inner+'</div></div>'}
function focusId(id){setTimeout(function(){var el=document.getElementById(id);if(el)el.focus()},0)}
function loginScreen(msg){
  document.getElementById('auth').innerHTML=authShell('<div><h1>Sign in</h1><p class="meta">Use your employee code and password.</p></div>'+
    '<form id="loginform" novalidate>'+
    '<div class="f"><label for="l-code">Employee code</label><input id="l-code" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20"></div>'+
    '<div class="f"><label for="l-pw">Password</label><input id="l-pw" type="password" autocomplete="current-password" maxlength="200"></div>'+
    '<label class="showpw" for="l-show"><input type="checkbox" id="l-show"> Show password</label>'+
    '<div class="err" id="l-err" role="alert">'+esc(msg||'')+'</div>'+
    '<button class="btn primary wide" id="l-btn" type="submit">Sign in</button></form>');
  showScreen('login');focusId('l-code');
}
function pwScreen(forced){
  document.getElementById('auth').innerHTML=authShell('<div><h1>'+(forced?'Choose a new password':'Change password')+'</h1><p class="meta">'+(forced?'You are using a temporary password. Set your own to continue. ':'')+'Use at least 8 characters with a letter and a number.</p></div>'+
    '<form id="pwform" novalidate>'+
    '<div class="f"><label for="p-cur">Current password</label><input id="p-cur" type="password" autocomplete="current-password" maxlength="200"></div>'+
    '<div class="f"><label for="p-new">New password</label><input id="p-new" type="password" autocomplete="new-password" maxlength="100"></div>'+
    '<div class="f"><label for="p-cf">Repeat new password</label><input id="p-cf" type="password" autocomplete="new-password" maxlength="100"></div>'+
    '<div class="err" id="p-err" role="alert"></div>'+
    '<button class="btn primary wide" id="p-btn" type="submit">Save password</button>'+
    (forced?'<button class="btn wide" id="p-out" type="button">Sign out</button>':'<button class="btn wide" id="p-cancel" type="button">Cancel</button>')+'</form>');
  showScreen('pw');focusId('p-cur');
}
function start(){return load().then(function(){try{UI.mod=localStorage.getItem('td-mod')==='pms'?'pms':'travel'}catch(x){}UI.tab=UI.mod==='pms'?'pms':'overview';showScreen('app');render()})}
function sessionEnded(){UI.uid='';UI.pms=null;S=emptyState();loginScreen('Your session ended. Sign in again.')}
function signOut(){
  api('POST','/api/logout').catch(function(){}).then(function(){UI.uid='';UI.pms=null;S=emptyState();UI.tab='overview';UI.form=false;UI.expForm=false;UI.step='enter';UI.expTab='new';UI.last=null;loginScreen()});
}
function doLogin(){
  var code=document.getElementById('l-code').value.trim(),pw=document.getElementById('l-pw').value,err=document.getElementById('l-err'),btn=document.getElementById('l-btn');
  if(!code||!pw){err.textContent='Enter your employee code and password.';return}
  btn.disabled=true;err.textContent='';
  api('POST','/api/login',{code:code,password:pw}).then(function(r){
    UI.uid=r.user.id;UI.tab='overview';
    return r.user.mustChange?pwScreen(true):start();
  }).catch(function(e){
    err.textContent=e.status?e.message:'Cannot reach the server. Try again in a moment.';btn.disabled=false;
    var p=document.getElementById('l-pw');if(p){p.value='';p.focus()}
  });
}
function doPassword(){
  var cur=document.getElementById('p-cur').value,nw=document.getElementById('p-new').value,cf=document.getElementById('p-cf').value,err=document.getElementById('p-err'),btn=document.getElementById('p-btn');
  if(!cur||!nw||!cf){err.textContent='Fill in all three fields.';return}
  if(nw!==cf){err.textContent='The new passwords do not match.';return}
  btn.disabled=true;err.textContent='';
  api('POST','/api/password',{current:cur,next:nw}).then(function(){toast('Password changed');return start()}).catch(function(e){err.textContent=e.message;btn.disabled=false});
}
document.addEventListener('change',function(e){if(e.target.id==='l-show'){document.getElementById('l-pw').type=e.target.checked?'text':'password'}});
document.addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='p-out')signOut();
  else if(id==='p-cancel'){showScreen('app')}
});
document.getElementById('signout').addEventListener('click',signOut);
document.getElementById('chpw').addEventListener('click',function(){pwScreen(false)});

api('GET','/api/me').then(function(u){UI.uid=u.id;return u.mustChange?pwScreen(true):start()}).catch(function(e){
  loginScreen(e.status===401?'':'Cannot reach the server. Try again in a moment.');
});
})();
</script>
</body>
</html>
